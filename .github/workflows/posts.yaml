name: Posts Updater

on:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  update-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Git setting
        run: |
          git config --local user.email "ARISA1115@users.noreply.github.com"
          git config --local user.name "ARISA1115"

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.2' 

      - name: Install dependencies
        run: go mod tidy

      - name: Run updater
        run: go run main.go

      - name: Commit and push changes
        run: |
          git add README.md
          git diff --quiet README.md || git commit -m "update posts!"
          git push origin main
